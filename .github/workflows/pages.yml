name: Publish LeBron TV
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Build site
        run: |
          npm install --no-save --no-package-lock @discord/embedded-app-sdk@2.5.0 esbuild@0.25.12
          mkdir -p public
          cp index.html tv.css tv.js lebron-tv.png public/
          npx --no-install esbuild discord-entry.js --bundle --format=esm --platform=browser --outfile=public/discord-sdk.js
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
